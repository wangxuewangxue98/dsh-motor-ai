# dsh-motor-ai 完整版 Cordis 配置补丁（bundle patch）
# ============================================================
# 本文件是插件的「组合包默认配置」。DSH 通过 package.json 的
#     dsh.bundle.patch -> ./cordis.patch.yml
# 识别该插件可作为组合包安装；profile 自身的 cordis.patch.yml
# 可在本层之上做用户级覆盖（同 id 行会合并/覆盖）。
#
# 层级设计：总闸 level = 'l2'（完整版覆盖 L0+L1+L2）。
#   - L0 永久免费，无码可用
#   - L1/L2 工具恒注册，**调用时**按激活码门控；无码/过期/无效
#     返回 LICENSE_REQUIRED 引导，绝不影响 L0
- insert:
    - id: dsh-motor-ai
      name: 'dsh-motor-ai'
      config:
        # ---- 层级总闸 ----
        level: 'l2'                        # 'l0' | 'l1' | 'l2'
        l1Enabled: true                    # L1（RMxprt 磁路法）分闸
        l2Enabled: true                    # L2（Motor-CAD 精验）分闸
        # ---- 激活验签（v2 非对称 Ed25519）----
        # 留空 = 使用包内置公钥 lib/activation-public.pem；
        # 仅在密钥轮换或测试时填 PEM 覆盖。
        activationPublicKeyPem: ''
        # ---- L0 运行参数（免费层）----
        l0Mode: 'auto'                     # formula | surrogate | auto
        surrogatePath: 'models/l0_surrogate_family.json'
        surrogateConfidenceThreshold: 0.4
        maxMatrixSize: 2000
        topNPreview: 20
        constantsSource: 'lib/motor-constants.mjs'
        # ---- 效率与温升口径 ----
        efficiencyCap: 96
        tempRiseRange: [45, 130]
        # ---- 物理校验参数（motor_design_validate）----
        airGapFluxT: 0.8                   # 气隙磁密基准 T
        insulationClass: 'F'               # B=80K / F=105K / H=125K
        highSpeedRpm: 8000                 # 超此转速气隙上限放宽到 4mm
        # ---- 脱敏聚合遥测（完整版默认开，2026-10-14）----
        # 只回传「按工具聚合的次数/成败/耗时/规模」，不含设计参数/结果/提示词/路径/密钥。
        # ⚠️ telemetryEndpoint 全文件只允许出现一次（YAML 禁重复键；DSH 客户端
        #    插件管理器用 yaml@2 严格模式解析补丁，遇重复键抛 "Map keys must be
        #    unique" → 判「patch file is not a valid entry list」→ 升级失败自动回滚）。
        #    端点取值见下方「聚合遥测端点」节；置空 = 回退 {后端}/api/dsh/dsh-plugins/dsh-motor-ai/usage-report。
        telemetryEnabled: true             # 总开关（boolean）；完整版默认开，置 false 显式退出
        telemetryBatchSize: 50
        telemetryMinIntervalMs: 60000      # 上报尝试最小间隔（0=不节流；兼容旧键 telemetryIntervalSec）
        sessionTelemetry: 'auto'           # auto = 顺带挂 DSH sessionTelemetry
        # ---- 免费额度旁路计数后端（P1 对齐 l0：预填官方接收端，2026-10-14）----
        # 仅旁路遥测用（fire-and-forget，不参与放行决策、不阻塞调用链；放行 100% 本地）。
        # 官方接收端（Deno Deploy 2，境内直连可达）：https://dsh-motor-ai-receiver.wangxuewangxue98.deno.net
        # 置空串 = 不发旁路计数（回退 env.DSH_BACKEND_URL → http://127.0.0.1:5000）。
        commerceBackendUrl: 'https://dsh-motor-ai-receiver.wangxuewangxue98.deno.net'
        # ---- 来源区分（v1.0.1：完整版与 l0 在后端账本上分离）----
        # 默认与 l0 同为 'dsh-motor-ai-l0'（两侧共用免费额度账的设计）；
        # 显式设为 'dsh-motor-ai-full' 后，receiver KV 计数键 ['fce'/'pd', plugin_id, ...]
        # 按本值分桶 —— 后端统计可区分来源，本地额度文件仍按 device 维度共用，不受影响。
        # ⚠️ 仅对新安装/升级到含本补丁版本的用户生效（cordis patch 在安装时注入）。
        quotaPluginId: 'dsh-motor-ai-full'
        # ---- 聚合遥测端点（v1.0.1：接通官方接收端 telemetry 通道）----
        # 完整版 telemetry 默认开（telemetryEnabled=true），缺省打 usage-report 路径
        # （Flask 后端契约，deno receiver 无此路径会 404 静默）。
        # 显式指向 receiver 的 /api/dsh/telemetry 后，版本分布/工具使用统计当天可见。
        telemetryEndpoint: 'https://dsh-motor-ai-receiver.wangxuewangxue98.deno.net/api/dsh/telemetry'
        # ---- 脱敏设计经验回传（默认开启；用于 L0 代理重训与经验回流，2026-10-21 起默认开）----
        designExperienceUpload: true
        experienceEndpoint: ''             # 空 = 同源派生 telemetryEndpoint 的 /api/dsh/experience
        experienceBatchSize: 200
        experienceMinIntervalMs: 60000     # design_exp 上报节流窗口（ms）；0 = 不节流
        # ---- 已解决问题回流（P1-B；贡献型、不占配额，默认关闭）----
        # 与 telemetry/designExperienceUpload 相互独立：本项回传「用户主动提交的
        # 已解决问题知识」（问题分类/症状/根因/改进措施/解决过程），喂在线知识库做知识积累。
        # 身份类字段（账号/路径/提示词/密钥）经白名单硬排除。开启后通过 submit_resolved_case 工具触发。
        issueResolvedEnabled: true        # 总开关（boolean）；默认开启（2026-10-21 起默认开，知识经验回流）
        issueResolvedEndpoint: ''         # 目标 URL；为空则回退 commerceBackendUrl + /api/dsh/issue-resolved
        # ---- 故障协助（在线经验智能支持，Part 二完整版，2026-10-21）----
        # 用户报故障时，提示上传脱敏故障情况 → 自动匹配在线知识库相似案例给经验建议；
        # 解决后用 submit_resolved_case 回流。faultAssistEnabled 默认开；端点缺省回退后端同源。
        faultAssistEnabled: true          # 故障协助总开关（boolean）；默认开启（opt-out 置 false）
        faultReportEndpoint: ''           # 脱敏故障上报 URL；空 = 回退 commerceBackendUrl + /api/dsh/fault-report
        issueQueryEndpoint: ''            # 相似案例查询 URL；空 = 回退 commerceBackendUrl + /api/dsh/issue-resolved/query
        # ---- 在线知识库入口（P1-C；为空 = 文案不带链接）----
        knowledgeBaseUrl: 'https://workbuddy.link/p/xWcD0qQyCUoGVl98S2LHei'  # 在线知识库公开入口（导航页）；空 = 文案不带链接（与 index.mjs 默认值保持一致，勿加 www）
        # ---- 设计经验自动注入（design-assist，2026-10-23）----
        # 设计前经 /api/dsh/kb/query 拉取 L1 杠杆 / L2 评价 / 策展经验，
        # 以 design_knowledge_hints 非破坏性追加到结果，不改动原有返回结构。
        designAssistEnabled: true          # 总开关（boolean）；默认开启（opt-out 置 false）
        kbQueryEndpoint: ''                # 知识查询 URL；空 = 回退 commerceBackendUrl + /api/dsh/kb/query
